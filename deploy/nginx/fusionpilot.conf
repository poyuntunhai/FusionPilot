# FusionPilot — one origin for the static frontend and both API services.
#
# Install:
#   sudo cp deploy/nginx/fusionpilot.conf /etc/nginx/sites-available/fusionpilot
#   sudo sed -i 's/your-domain.com/YOUR.DOMAIN/' /etc/nginx/sites-available/fusionpilot
#   sudo ln -s /etc/nginx/sites-available/fusionpilot /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then HTTPS (this file gets a 443 block added by certbot automatically):
#   sudo certbot --nginx -d YOUR.DOMAIN
#
# Why everything is on one origin: the backend has no CORS configuration, and the
# frontend calls /api/... with relative URLs. Serving both from the same host is
# what makes that work. Putting the frontend on a separate domain or port would
# require adding CORS to the backend first.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    root /opt/fusionpilot/web/dist;
    index index.html;

    # Dataset import posts a file; the backend's own limit is 100 MB.
    client_max_body_size 110m;

    # certbot's HTTP-01 challenge is served from here, not from the SPA.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The SPA keeps its route in the URL, so an unknown path must return
    # index.html instead of 404 or a refresh on /workbench breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite content-hashes these filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Agent service. nginx matches the longest prefix, not the first block, so
    # this is reached for /api/v1/agent/... regardless of the order below.
    #
    # /api/v1/agent/* belongs to the Python service even though the Java backend
    # also exposes /api/v1/agent/conversations: the agent owns the conversation
    # orchestration and calls Java server-to-server to persist it. This mirrors
    # the dev proxy in web/vite.config.ts.
    location /api/v1/agent/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # This is the whole point of the agent endpoint: token-by-token SSE.
        # With buffering on, nginx holds the response until the turn ends and the
        # user sees one lump instead of a stream.
        proxy_buffering off;
        proxy_cache off;
        # A multi-step plan can run several simulations; give it room.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Everything else under /api belongs to the Java backend.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 300s;
    }
}
