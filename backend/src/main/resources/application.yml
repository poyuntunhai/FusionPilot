spring:
  application:
    name: fusionpilot-backend
  datasource:
    url: ${FUSIONPILOT_DB_URL:jdbc:h2:mem:fusionpilot;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: ${FUSIONPILOT_DB_USERNAME:sa}
    password: ${FUSIONPILOT_DB_PASSWORD:}
    driver-class-name: ${FUSIONPILOT_DB_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: ${FUSIONPILOT_DATASET_MAX_FILE_SIZE:100MB}
      max-request-size: ${FUSIONPILOT_DATASET_MAX_REQUEST_SIZE:110MB}

server:
  port: ${BACKEND_PORT:8080}

fusionpilot:
  version: 0.1.0-SNAPSHOT
  auth:
    return-development-reset-token: true
