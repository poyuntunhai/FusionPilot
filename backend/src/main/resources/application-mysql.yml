spring:
  datasource:
    url: ${FUSIONPILOT_DB_URL:jdbc:mysql://127.0.0.1:3306/fusionpilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${FUSIONPILOT_DB_USERNAME:fusionpilot}
    password: ${FUSIONPILOT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always

fusionpilot:
  auth:
    # Secure by default on the profile used for real deployments: returning the reset token in
    # the response lets anyone reset anyone's password. See deploy/env.example.
    return-development-reset-token: ${FUSIONPILOT_RETURN_RESET_TOKEN:false}
