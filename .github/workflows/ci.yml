name: CI

# Three independent jobs, one per application. None of them needs MySQL, a model API key or a running
# service: the Java tests run on in-memory H2, and the agent suite drives the ASGI app in-process with
# the outbound Java and provider calls stubbed, so it is deterministic and offline.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    name: Agent service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Behaviour evaluation suite
        run: python -m evals.run_evals

  backend:
    name: Simulation core (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Make the wrapper executable
        # The repository is developed on Windows, where git may not record the executable bit.
        run: chmod +x ./mvnw
      - name: Tests
        run: ./mvnw -B test

  web:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check and build
        # `vue-tsc -b` is the form that actually checks anything; the root tsconfig is a solution
        # file, so a plain `vue-tsc --noEmit` silently checks no project.
        run: npm run build
